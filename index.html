<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef AI - Pencari Resep Masakan</title>
  
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #d9534f; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #d9534f; color: white; border: none; font-weight: bold; border-radius: 6px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    button:disabled { background-color: #aaa; }
    #resultContainer { margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
    .recipe-card { background: #fafafa; padding: 15px; border-radius: 8px; border-left: 4px solid #d9534f; }
    .recipe-meta { font-size: 13px; color: #555; background: #fff; padding: 8px; border-radius: 4px; margin: 10px 0; }
    ul, ol { margin-left: 20px; margin-bottom: 15px; font-size: 14px; }
    li { margin-bottom: 5px; }
    .error-box { color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; padding: 12px; border-radius: 6px; font-size: 14px; word-break: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h1>👨‍🍳 Chef AI Resep</h1>
    
    <div class="form-group">
      <label for="recipeQuery">Bahan / Nama Masakan:</label>
      <input type="text" id="recipeQuery" placeholder="Contoh: Ayam, Telur, Cabai">
    </div>

    <div class="form-group">
      <label for="difficulty">Tingkat Kesulitan:</label>
      <select id="difficulty">
        <option value="Bebas">Bebas</option>
        <option value="Mudah">Mudah</option>
        <option value="Sedang">Sedang</option>
        <option value="Sulit">Sulit</option>
      </select>
    </div>

    <button type="button" id="btnCari" onclick="prosesCari()">Cari Resep AI</button>

    <div id="resultContainer"></div>
  </div>

  <script>
    async function prosesCari() {
      const query = document.getElementById("recipeQuery").value.trim();
      const difficulty = document.getElementById("difficulty").value;
      const btnCari = document.getElementById("btnCari");
      const resultContainer = document.getElementById("resultContainer");

      if (!query) {
        alert("Harap masukkan bahan atau nama masakan!");
        return;
      }

      btnCari.disabled = true;
      btnCari.innerText = "Memproses AI...";
      resultContainer.innerHTML = "<p style='text-align:center;'>⏳ Sedang meracik resep dari Gemini AI...</p>";

      try {
        const response = await fetch("/.netlify/functions/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, difficulty })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "Gagal mendapatkan data dari AI server.");
        }

        renderRecipe(result.data);

      } catch (error) {
        resultContainer.innerHTML = `
          <div class="error-box">
            ❌ <strong>Gagal Memuat Resep:</strong><br>
            ${error.message}
          </div>
        `;
      } finally {
        btnCari.disabled = false;
        btnCari.innerText = "Cari Resep AI";
      }
    }

    function renderRecipe(data) {
      const container = document.getElementById("resultContainer");
      
      const ingredientsHtml = (data.ingredients || []).map(i => `<li>${i}</li>`).join("");
      const stepsHtml = (data.steps || []).map(s => `<li>${s}</li>`).join("");

      container.innerHTML = `
        <div class="recipe-card">
          <h2>${data.title || "Resep Masakan"}</h2>
          <p style="font-style:italic; font-size:13px; margin-top:4px;">${data.description || ""}</p>
          
          <div class="recipe-meta">
            ⏱️ <strong>Waktu:</strong> ${data.prepTime || "-"} | 
            🍽️ <strong>Porsi:</strong> ${data.servings || "-"} | 
            📊 <strong>Tingkat:</strong> ${data.difficulty || "-"}
          </div>

          <h4 style="margin-bottom:6px;">Bahan-bahan:</h4>
          <ul>${ingredientsHtml}</ul>

          <h4 style="margin-bottom:6px;">Langkah-langkah:</h4>
          <ol>${stepsHtml}</ol>
        </div>
      `;
    }
  </script>
</body>
</html>
